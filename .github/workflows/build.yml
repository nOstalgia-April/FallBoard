name: Test, build and release FallBoard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fallboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot and verify SHA512 checksums
        run: python3 tools/install_godot.py
      - name: Import project
        run: godot --headless --editor --path . --import
      - name: Rules, AI and level solvability
        run: godot --headless --path . --script tests/run_tests.gd
      - name: UI interaction and restart safety
        run: godot --headless --path . --script tests/ui_tests.gd
      - name: Export Windows and Web
        run: |
          mkdir -p builds/windows builds/web
          touch builds/.gdignore
          godot --headless --path . --export-release "Windows Desktop" builds/windows/FallBoard.exe
          godot --headless --path . --export-release "Web" builds/web/index.html
          python3 tools/package_builds.py
      - name: Render actual game screenshots
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --path . --resolution 1440x900 --script tests/visual_capture.gd
      - name: Save downloadable builds
        uses: actions/upload-artifact@v4
        with:
          name: FallBoard-v0.1
          path: dist/*
          retention-days: 30
      - name: Publish versioned download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.0-${GITHUB_SHA::7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "FallBoard v0.1.0 (${GITHUB_SHA::7})" --notes-file docs/release-notes.md --latest
          fi
      - name: Save Web build for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser playable build
        id: deployment
        uses: actions/deploy-pages@v4
